<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>bench — Call of Duty, looped</title>
<style>
  html, body { margin: 0; background: #000; overflow: hidden; height: 100%; cursor: none; }
  video { width: 100vw; height: 100vh; object-fit: fill; display: block; }
  #err { position: fixed; inset: 0; display: none; place-content: center; color: #f66;
         font: 16px/1.6 system-ui, sans-serif; text-align: center; padding: 4rem; }
</style>
</head>
<body>
<video id="v" muted playsinline preload="auto" loop></video>
<div id="err"></div>
<script>
// The bench's reference content: Call of Duty gameplay, 1440p60, from the
// moment the action starts. This is the hardest case of the whole campaign —
// it costs QP 25 at 40 Mbit/s where a platformer clip holds 18 — and it is the
// one that matters, because it is what the target player is actually looking at.
//
// Two properties the measurements depend on:
//   - LOOPED, so a long series of clicks never runs off the end of the clip and
//     starts measuring a black screen;
//   - playback begins a fixed 3 s after load, and the runner starts its pass
//     3.5 s after opening this page, so every setting is measured on the same
//     seconds of the same footage. Without that the comparison between two
//     settings is a comparison between two different explosions.
//
// ?t=<seconds> moves the start, ?src=<url> points at a different file,
// ?rate=<n> changes the playback speed, ?fps=<n> asks for n DISTINCT frames per
// second whatever the clip's own cadence is (see below).
//
// rate is how a 60 fps clip feeds a 120 fps test: at ×2 the decoder emits 120
// distinct frames per second, so every frame the encoder is asked for has new
// pixels in it. A 60 fps source played at ×1 on a 120 Hz screen would hand the
// encoder each frame twice, and half the measurement would be about how cheap
// a duplicate is to encode.
const v = document.getElementById("v");
const q = new URLSearchParams(location.search);
const start = Number(q.get("t") ?? 37);
let rate = Number(q.get("rate") ?? 1);
// ?fps=120 measures the clip's real cadence during the first second of playback
// and sets the speed that makes the decoder emit that many distinct frames per
// second: ×2 for a 60 fps clip, ×1 for a true 120 fps one. Measured, never read
// from the file's name or from ffprobe — a .webm reports a rate derived from its
// time base, and cod_120fps.webm turned out to carry 59 fps (21/09/2026), which
// made a whole "120 fps" sweep capture at 60.
const wantFps = Number(q.get("fps") ?? 0);
// The clip is ~260 MB and does not belong in a git repository: fetch-content.ps1
// puts it in the local cache and passes its file:// URL here.
v.src = q.get("src") ?? "cod.webm";
v.addEventListener("loadedmetadata", () => { v.currentTime = start; });
// `loop` restarts at 0; the interesting seconds start at `start`, so seek back
// there rather than watching the menu screens on every lap.
v.addEventListener("seeked", () => {}, { once: true });
v.addEventListener("timeupdate", () => { if (v.currentTime < start - 1) v.currentTime = start; });
v.addEventListener("error", () => {
  const e = document.getElementById("err");
  e.style.display = "grid";
  e.textContent = "No clip at " + v.src + " — run fetch-content.ps1 first.";
});
// Set on every play: a seek or a loop restart resets playbackRate on some
// builds, and a pass that silently drops back to ×1 halfway through is worse
// than one that never sped up at all.
const applyRate = () => { if (v.playbackRate !== rate) v.playbackRate = rate; };
v.addEventListener("play", applyRate);
v.addEventListener("ratechange", applyRate);
function tuneToFps() {
  if (!(wantFps > 0) || !("requestVideoFrameCallback" in v)) return;
  let first = null, last = null, n = 0;
  const onFrame = (_now, meta) => {
    if (first === null) first = meta.mediaTime;
    last = meta.mediaTime; n++;
    if (n < 45) { v.requestVideoFrameCallback(onFrame); return; }
    const span = last - first;
    // Frames per second of MEDIA time, measured at the speed the clip is playing
    // at right now (1), so it is the clip's own cadence.
    const clipFps = span > 0 ? (n - 1) / (span / v.playbackRate) : 0;
    if (clipFps > 1) {
      rate = wantFps / clipFps;
      applyRate();
      console.log("clip cadence " + clipFps.toFixed(1) + " fps -> playbackRate " + rate.toFixed(3));
    }
  };
  v.requestVideoFrameCallback(onFrame);
}
v.addEventListener("playing", tuneToFps, { once: true });
setTimeout(() => { applyRate(); v.play().catch(e => console.log("play refused: " + e)); }, 3000);
</script>
<script src="escape.js"></script>
</body>
</html>
