# AllShare — publish a Windows release.
#
# Creates the GitHub Release (and its v* tag) with the AllShare notes, then runs
# release.yml on that tag for Windows x64 only: the tag build is the PROD
# edition, versioned from the tag, and its softprops step uploads the installer
# into this release.
#
# The tag is created with GITHUB_TOKEN, which starts no other workflow — so the
# full ci.yml matrix (macOS signing, Linux repositories, Homebrew, AUR: all
# needing the upstream project's secrets) does not run for it.
name: AllShare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.0"
        type: string
        required: true
        default: "1.0.0"

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Create the release and start the Windows build
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          tag="v${VERSION#v}"
          cat > notes.md <<'EOF'
          **AllShare (Powered by MMC)** — [Moonlight‑Web](https://github.com/linckosz/moonlight-web) with a new name and logo, plus:

          - **Wake a sleeping PC more reliably** — the Wake button sends the magic packet through every network card of the server, to more ports, three times; the card shows *Waking…* until the PC answers.
          - **Mouse fixes for games** — turn a full 360° in games that look around with the mouse (Roblox, first-person games): when a game hides the PC's pointer while you move the mouse, the next click or key captures the mouse, and it is released when the game shows its pointer again. Mouse Gaming Mode now also works on touchscreen laptops, 2-in-1s and tablets with a mouse. Clicking the black bars beside the picture no longer parks the PC's pointer on the side of its screen.
          - **Picture fill** — *Settings → Picture Fill* or <kbd>Shift</kbd>+<kbd>Ctrl</kbd>+<kbd>Alt</kbd>+<kbd>F</kbd>: *Fit*, *Stretch* or *Zoom*, so the stream fills the window when not in fullscreen.

          **Install:** download `MoonlightWeb-installer-…-win-x64.exe` below and run it. The installer is not code-signed: if Windows SmartScreen warns, choose *More info → Run anyway*.
          EOF
          gh release create "$tag" --target "$GITHUB_SHA" --title "AllShare $tag" --notes-file notes.md
          gh workflow run release.yml --ref "$tag" -f platform=windows-x64
          echo "Release $tag created; the installer is added by the release.yml run on $tag." >> "$GITHUB_STEP_SUMMARY"
